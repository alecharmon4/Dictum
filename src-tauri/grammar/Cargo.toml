[package]
name = "dictum-grammar"
version = "0.1.0"
description = "Live, system-wide Harper grammar highlights for Dictum"
edition = "2024"
license = "Apache-2.0"
publish = false

# Ported from Harper Desktop v2.11.0 (Apache-2.0, see LICENSE-HARPER):
# https://github.com/Automattic/harper/tree/v2.11.0/harper-desktop

[dependencies]
harper-core = "=2.11.0"
harper-dictionary-wordlist = "=2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
winit = "0.30.13"
egui = "0.34.1"
egui-winit = "0.34.1"
egui-wgpu = { version = "0.34.1", features = ["winit"] }
egui_commonmark = "0.23.0"
pollster = "1.0.1"
dirs = "6.0.0"
cached = "2.0.2"
tauri-plugin-os = "2.3.2"
tokio = { version = "1.52.1", default-features = false, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility = "0.2.0"
accessibility-sys = "0.2.0"
send_wrapper = "0.6.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "NSApplication",
    "NSImage",
    "NSRunningApplication",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSGeometry",
    "objc2-core-foundation",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
uiautomation = { version = "0.25.0", features = ["process"] }
wintheon = "0.1.0"
is-macro = "0.3.7"
